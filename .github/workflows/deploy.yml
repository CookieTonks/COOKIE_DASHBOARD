name: Deploy FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Evita que dos subidas al mismo servidor se pisen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Preparar configuración de prueba
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

  # Corre en otra máquina limpia: el .env de prueba nunca puede llegar al servidor.
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: lo usa el paso de fechas

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          tools: composer:v2

      - name: Generar vendor para producción
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # lftp compara tamaño y fecha con el servidor y solo sube lo que cambió.
      # Para eso, cada archivo lleva la fecha de su último commit, y no la del checkout.
      - name: Fijar fechas de los archivos
        run: |
          git ls-files | while IFS= read -r f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done
          # vendor/ solo cambia junto con composer.lock...
          find vendor -exec touch -d "@$(git log -1 --format=%ct -- composer.lock)" {} +
          # ...salvo el autoload, que también lista las clases de app/.
          touch -d "@$(git log -1 --format=%ct)" vendor/composer/*

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Si el hosting corta la conexión, lftp reconecta y sigue donde iba.
      # No usa --delete: nunca borra nada del servidor (.env, logs, sesiones).
      # La cuenta FTP entra directo a la carpeta de la app (la que contiene public/,
      # nunca public/ misma), por eso se sube a su raíz.
      # vendor/ debe subirse: el servidor no corre composer.
      # Los .gitignore de storage/ también: mantienen sus carpetas vacías.
      - name: Subir por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          lftp --env-password -u "$FTP_USER" "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 30
          set net:max-retries 30
          set net:persist-retries 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          mirror --reverse --verbose --no-perms --parallel=1 \
            -x '^\.git/' \
            -x '^\.github/' \
            -x 'node_modules/' \
            -x '(^|/)\.env($|\.)' \
            -x '^tests/' \
            -x '^docker/' \
            -x '^docker-compose\.yml$' \
            -x '^\.dockerignore$' \
            -x '^phpunit\.xml$' \
            -x '^\.phpunit\.result\.cache$' \
            -x '^graphify-out/' \
            -x '^database/.*\.sqlite$' \
            -x '^storage/logs/.*\.log$' \
            ./ ./
          bye
          LFTP
