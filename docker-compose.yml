services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: recordatorios_app
    restart: unless-stopped
    env_file: .env
    environment: &laravel-env
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-recordatorios}
      DB_USERNAME: ${DB_USERNAME:-recordatorios}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  # Sin este servicio no salen los recordatorios automáticos.
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: recordatorios_scheduler
    restart: unless-stopped
    command: scheduler
    env_file: .env
    environment: *laravel-env
    volumes:
      - storage:/var/www/storage
    depends_on:
      - app

  nginx:
    image: nginx:stable
    container_name: recordatorios_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8
    container_name: recordatorios_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recordatorios}
      MYSQL_USER: ${DB_USERNAME:-recordatorios}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  storage:
